<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Austrália</title>
    <link rel="stylesheet" href="assets/estilo.css">
</head>
<body id="topo">
    <header>
        <h1>CONTATO</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
            <li><a href="sobre.html">Sobre</a></li>
                <li><a href="destino.html">Destinos</a></li>
            <li><a href="contato.html" class="active">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="banner-intro">
            <h2>Fale Conosco</h2>
         <p>Estamos prontos para te ajudar.</p>
        </section>

        <section class="form-box">
            <form>
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" required>

             <label for="email">E-mail:</label>
                <input type="email" id="email" required>

               <label for="tel">Telefone:</label>
             <input type="tel" id="tel">

                <label for="cidade">Cidade de Interesse:</label>
                <select id="cidade">
                    <option value="sydney">Sydney</option>
                    <option value="perth">Perth</option>
                    <option value="goldcoast">Gold Coast</option>
                </select>

                <label for="data">Data Pretendida:</label>
                <input type="date" id="data">

                <label for="meses">Duração (meses):</label>
                <input type="number" id="meses" min="1" max="12">

                <label>Tipo de Programa:</label>
                <input type="radio" name="tipo" value="estudo" id="estudo"> <label for="estudo" style="display:inline; font-weight:normal;">Estudo</label>
                <input type="radio" name="tipo" value="trabalho" id="trabalho" style="margin-left:15px;"> <label for="trabalho" style="display:inline; font-weight:normal;">Trabalho</label>
                
              <br><br>

                <label for="msg">Mensagem:</label>
                <textarea id="msg" rows="5"></textarea>

                <button type="submit" class="btn-acao">ENVIAR AGORA</button>
            </form>
        </section>

        <a href="#topo" class="ancora-topo">↑ Voltar ao topo</a>
    </main>
    <footer><p>Austrália</p></footer>
</body>
</html>
